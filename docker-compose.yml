name: agence-dvpt

services:
  # ============================================================================
  # 1. SERVER MLFLOW (Gestion du cycle de vie des modèles)
  # ============================================================================
  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      # Ce dossier local contiendra à la fois les fichiers d'artéfacts ET la base de données
      - ./mlruns:/mlruns
    command: mlflow server --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns --host 0.0.0.0 --port 5000
    restart: unless-stopped

  # ============================================================================
  # 2. BACKEND API - FASTAPI (Moteur d'exécution et endpoints ETL/Train/Predict)
  # ============================================================================
  fastapi_server: 
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fastapi_server
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./mlruns:/mlruns
    environment:
      - PYTHONPATH=/app:/app/api
      - GIT_COMMIT=${GIT_COMMIT:-indisponible}
      # Alignement des variables de tracking MLflow pour correspondre au code (main.py)
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - MLFLOW_TRACKING_SERVER=http://mlflow_server:5000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mlflow_server
    env_file:
      - .env
    restart: unless-stopped

  # ============================================================================
  # 3. INTERFACE UTILISATEUR - STREAMLIT (Visualisation et formulaires dynamiques)
  # ============================================================================
  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - API_URL=http://fastapi_server:8000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /app
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - fastapi_server 
    env_file:
      - .env
    restart: unless-stopped

  # ============================================================================
  # 4. ORCHESTRATEUR / SCHEDULER (Déclenchement automatique de l'ETL et du Train)
  # ============================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: scheduler
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - GIT_COMMIT=${GIT_COMMIT:-indisponible}
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    working_dir: /app
    command: python scheduler/scheduler.py
    depends_on:
      - fastapi_server
    env_file:
      - .env
    restart: unless-stopped

  # ============================================================================
  # 5. PROMETHEUS ET GRAFANA
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./api_password.txt:/etc/prometheus/secrets/api_password.txt
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_storage:/var/lib/grafana
    environment:
      # Chargement dynamique depuis le fichier .env via interpolation Docker Compose
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
    depends_on:
      - prometheus
    restart: unless-stopped

  # ============================================================================
  # 6. NODE-EXPORTER
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped